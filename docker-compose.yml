services:
  netbird-client:
      container_name: netbird-client
      # hostname: <HOSTNAME> # [REMOVED]
      cap_add:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
      devices:
          # Required when using userspace mode or when kernel module is not available
          - /dev/net/tun
      network_mode: host
      # environment:                    # [REMOVED]
          # - NB_SETUP_KEY=<SETUP KEY>  # [REMOVED]
      volumes:
          - netbird-client:/var/lib/netbird
      image: netbirdio/netbird:latest
# volumes:                      # [REMOVED]
#   netbird-client:             # [REMOVED]
#       name: netbird-client    # [REMOVED]
