services:
  app:
    # container_name: netbird-client
    hostname: ${HOSTNAME}
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      # Required when using userspace mode or when kernel module is not available
      - /dev/net/tun
    network_mode: host
    env_file:
      - ${SECRET_ENV_FILE}
    # environment:
    #   - NB_SETUP_KEY=${NB_SETUP_KEY}
    volumes:
      - data:/var/lib/netbird
    image: netbirdio/netbird:latest

volumes:
  data:
    # name: netbird-client
