---
services:
  netbird-client:
    hostname: ${HOSTNAME} # This is what will show in the netbird server dashboard
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      # Required when using userspace mode or when kernel module is not available
      - /dev/net/tun
    network_mode: host
    volumes:
      - ${DATA:-data}:/var/lib/netbird
    image: ${IMAGE:-netbirdio/netbird}:${TAG:-latest}

volumes:
  data:
